# overriding ~/.config/tmux/tmux.conf from omarchy
bind q source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded..."

# Handy bindings
bind -r G neww -c "#{pane_current_path}" "lazygit" 
bind -r E neww -c "#{pane_current_path}" "nvim ~/.config/espanso/match/" 
bind -r T neww -c "#{pane_current_path}" "nvim ~/dev/dotfile/tmux/tmux-overrides.conf"
bind -r N neww -c "#{pane_current_path}" "nvim ~/dev/notes/"
bind -r f neww -c "#{pane_current_path}" "~/bin/tmux-sessionizer.sh"
# bind -r S neww -c "#{pane_current_path}" "~/bin/tmux-fzf-session.sh"
bind -r s neww -c "#{pane_current_path}" "~/bin/tmux-fzf-session.sh"

# Open window, split with current path
bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"


bind -r H display-popup -k -b double "cat << EOF
──────────────[ TMUX KEY BINDINGS ]──────────────
Prefix (Ctrl-Space / Ctrl-b):
  q                 Reload config
  G                 Open lazygit
  E                 Open espanso config
  N                 Open notes directory
  T                 Open tmux config

  h / v             Split pane horizontally / vertically
  { / }             Swap pane with left / right

  x                 Kill pane
  k / K             Kill window / session

  c / C             New window / session
  r / R             Rename window / session

  < / >             Tab / window menu
  S                 Open sessionizer
  F                 Open fzf session

──────────────────[ NO PREFIX ]──────────────────
  M-Up/Down         Select session prev / next
  M-Left/Right      Select window left / right
  C-M-Left/Right    Select pane left / right
  S-M-Left/Right    Swap window left / right

EOF"
set -g status-right "#[bg=orange,fg=brightblack]#{?client_prefix, PREFIX ,}#[bg=default,fg=red] #h "
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=red,bold](#I)#W "
