
# hyprland config overrides for omarchy

## monitors.conf
env = GDK_SCALE,1
monitor = ,preferred,auto,1
monitor = HDMI-A-1,preferred,auto,auto
monitor = DP-1,preferred,auto-left,auto, transform, 3

# NVIDIA environment variables
env = NVD_BACKEND,direct
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia


## input.conf
# Map XP-Pen tablet to primary monitor only (HDMI-A-1)
device {
    name = opentabletdriver-virtual-artist-tablet
    output = HDMI-A-1
}

## looknfeel.conf

general {
    # No gaps between windows or borders
    gaps_in = 4
    gaps_out = 4

    # Use master layout instead of dwindle
    # layout = master
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    # Use round window corners
    rounding = 8
}


# bindings.conf
# Removing default bindings
unbindd = SUPER SHIFT, W      # Typora
unbindd = SUPER SHIFT ALT, F  # file manager in cwd 
unbindd = SUPER SHIFT, G      # Signal
unbindd = SUPER SHIFT, A      # ChatGPT
unbindd = SUPER SHIFT, Y      # YouTube
unbindd = SUPER SHIFT ALT, G  # WhatsApp
unbindd = SUPER SHIFT CTRL, G # Google Messages
unbindd = SUPER SHIFT, X # "https://x.com/"
unbindd = SUPER SHIFT ALT, X # "https://x.com/compose/post"
unbind = SUPER CTRL, SPACE # unbind theme menu to use it for espanso

# Adding my bindings
bindd = SUPER SHIFT ALT, D, Excalidraw, exec, omarchy-launch-webapp "https://excalidraw.com/"
bindd = SUPER SHIFT, T, Activity, exec, omarchy-launch-tui btop

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://calendar.google.com/calendar/u/0/r"
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://mail.google.com/"
bindd = SUPER SHIFT, P, Google Photos, exec, omarchy-launch-or-focus-webapp "Google Photos" "https://photos.google.com/albums"
